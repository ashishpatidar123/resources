name: Restructure Learning Resources

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message
        required: false
        default: Restructure learning resources

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restructure files and update site
        run: |
          python <<'PY'
          from pathlib import Path
          import re, shutil, sys, textwrap

          moves = {
            "docs/01-requirements-engineering.md":"docs/learning/system-design/requirements-engineering.md",
            "docs/Consistent Hashing.md":"docs/learning/distributed-systems/consistent-hashing.md",
            "docs/DSA/Graph_Algorithms.md":"docs/learning/dsa/graph-algorithms.md",
            "docs/Distributed Rate Limiting with Redis and Lua Scripting.md":"docs/learning/distributed-systems/distributed-rate-limiting.md",
            "docs/LSM-Tress vs B+ Trees.md":"docs/learning/dbms/lsm-trees-vs-b-trees.md",
            "docs/Lock Free Concurrency.md":"docs/learning/os-networking/lock-free-concurrency.md",
            "docs/Message Broker Hardware Sympathy.md":"docs/learning/distributed-systems/message-broker-hardware-sympathy.md",
            "docs/Microservices Data Consistency: Dual-Write, 2PC and the Transactional Outbox Pattern.md":"docs/learning/distributed-systems/transactional-outbox-and-dual-write.md",
            "docs/Multi-Level Indexing in Databases.md":"docs/learning/dbms/multi-level-indexing.md",
            "docs/Multi-Version Concurrency Control.md":"docs/learning/dbms/mvcc-internals.md",
            "docs/OS/Hardware Mechanical Sympathy.md":"docs/learning/os-networking/hardware-mechanical-sympathy.md",
            "docs/PostgreSQL Internals.md":"docs/learning/dbms/postgresql-internals.md",
            "docs/System Design/System Design.md":"docs/learning/system-design/system-design-fundamentals.md",
            "docs/learning/dbms/2026-11-22-mvcc-and-snapshot-isolation.md":"docs/learning/dbms/mvcc-and-snapshot-isolation.md",
            "docs/learning/dsa-practice/README.md":"docs/learning/dsa/practice-log.md",
            "docs/learning/dsa/2026-11-24-rerooting-dp-on-trees.md":"docs/learning/dsa/rerooting-dp-on-trees.md",
            "docs/learning/ml-ai/2026-11-23-probability-calibration.md":"docs/learning/ml-ai/probability-calibration.md",
          }
          titles = {
            "docs/learning/system-design/requirements-engineering.md":"Requirements Engineering: Define the Problem Before Designing",
            "docs/learning/distributed-systems/consistent-hashing.md":"Consistent Hashing and Virtual Nodes",
            "docs/learning/dsa/graph-algorithms.md":"Graph Algorithms",
            "docs/learning/distributed-systems/distributed-rate-limiting.md":"Distributed Rate Limiting with Redis and Lua Scripting",
            "docs/learning/dbms/lsm-trees-vs-b-trees.md":"B+ Trees vs LSM Trees: Indexing and Storage Engine Trade-offs",
            "docs/learning/os-networking/lock-free-concurrency.md":"Lock-Free Concurrency and the ABA Problem",
            "docs/learning/distributed-systems/message-broker-hardware-sympathy.md":"Message Broker Hardware Sympathy: Sequential I/O and Zero-Copy",
            "docs/learning/distributed-systems/transactional-outbox-and-dual-write.md":"Microservices Data Consistency: Dual-Write, 2PC and the Transactional Outbox Pattern",
            "docs/learning/dbms/multi-level-indexing.md":"Multi-Level Indexing in Databases",
            "docs/learning/dbms/mvcc-internals.md":"Multi-Version Concurrency Control (MVCC) Internals",
            "docs/learning/os-networking/hardware-mechanical-sympathy.md":"Hardware Mechanical Sympathy: CPU Cache Coherence and False Sharing",
            "docs/learning/dbms/postgresql-internals.md":"PostgreSQL Internals",
            "docs/learning/system-design/system-design-fundamentals.md":"System Design Concepts: A Comprehensive Guide",
            "docs/learning/dbms/mvcc-and-snapshot-isolation.md":"MVCC and Snapshot Isolation: How Databases Let Readers and Writers Coexist",
            "docs/learning/dsa/practice-log.md":"DSA Interview Practice Log",
            "docs/learning/dsa/rerooting-dp-on-trees.md":"Rerooting DP on Trees: Compute Answers for Every Root in Linear Time",
            "docs/learning/ml-ai/probability-calibration.md":"Probability Calibration: Making ML Confidence Trustworthy",
          }
          # Safety checks: don't overwrite files and abort if a source is missing.
          for src, dst in moves.items():
            if not Path(src).is_file():
              sys.exit(f"Missing expected source: {src}. No restructuring was performed.")
            if Path(dst).exists():
              sys.exit(f"Destination already exists: {dst}. Refusing to overwrite.")
          for src, dst in moves.items():
            Path(dst).parent.mkdir(parents=True, exist_ok=True)
            shutil.move(src, dst)

          # Change only the first H1 and existing frontmatter title fields.
          for path, title in titles.items():
            p = Path(path); s = p.read_text(encoding="utf-8")
            h1 = re.compile(r"(?m)^# .*$")
            s = h1.sub("# " + title, s, count=1) if h1.search(s) else "# " + title + "\n\n" + s
            if s.startswith("---\n") or s.startswith("---\r\n"):
              endmatch = re.search(r"(?m)^---\s*$", s[4:])
              if endmatch:
                end = 4 + endmatch.end(); fm, body = s[:end], s[end:]
                fm = re.sub(r"(?m)^title\s*:\s*.*$", "title: " + title, fm, count=1)
                s = fm + body
            p.write_text(s, encoding="utf-8")

          # Update old path strings in any Markdown files (including links).
          for p in Path("docs").rglob("*.md"):
            s = p.read_text(encoding="utf-8")
            for src, dst in moves.items():
              s = s.replace(src, dst).replace(src.removeprefix("docs/"), dst.removeprefix("docs/"))
            p.write_text(s, encoding="utf-8")

          (Path("docs/index.md")).write_text(textwrap.dedent("""
          # Learning Resources

          A structured, searchable knowledge base for continuous learning across software engineering and computer science.

          ## Learning paths

          ### Data Structures & Algorithms
          - [Graph Algorithms](learning/dsa/graph-algorithms.md)
          - [Rerooting DP on Trees](learning/dsa/rerooting-dp-on-trees.md)
          - [Interview Practice Log](learning/dsa/practice-log.md)

          ### Database Systems
          - [Multi-Level Indexing](learning/dbms/multi-level-indexing.md)
          - [B+ Trees vs LSM Trees](learning/dbms/lsm-trees-vs-b-trees.md)
          - [MVCC Internals](learning/dbms/mvcc-internals.md)
          - [MVCC and Snapshot Isolation](learning/dbms/mvcc-and-snapshot-isolation.md)
          - [PostgreSQL Internals](learning/dbms/postgresql-internals.md)

          ### Distributed Systems
          - [Consistent Hashing](learning/distributed-systems/consistent-hashing.md)
          - [Distributed Rate Limiting](learning/distributed-systems/distributed-rate-limiting.md)
          - [Dual-Write, 2PC and Transactional Outbox](learning/distributed-systems/transactional-outbox-and-dual-write.md)
          - [Message Broker Hardware Sympathy](learning/distributed-systems/message-broker-hardware-sympathy.md)

          ### Operating Systems & Networking
          - [Hardware Mechanical Sympathy](learning/os-networking/hardware-mechanical-sympathy.md)
          - [Lock-Free Concurrency](learning/os-networking/lock-free-concurrency.md)

          ### System Design
          - [System Design Concepts](learning/system-design/system-design-fundamentals.md)
          - [Requirements Engineering](learning/system-design/requirements-engineering.md)

          ### Machine Learning & AI
          - [Probability Calibration](learning/ml-ai/probability-calibration.md)

          ## Daily learning
          - [Topic tracker](learning/topic-tracker.md) — coverage log and weekly learning rotation.

          Lessons retain their explanations, examples, and references; this index is the directory.
          """), encoding="utf-8")

          (Path("docs/learning/topic-tracker.md")).write_text(textwrap.dedent("""
          # Daily Engineering Learning — Topic Tracker

          Canonical deduplication log. Before preparing each lesson, check this tracker and repository files. Avoid repeating the same topic or substantially overlapping treatment; choose a fresh subtopic or deeper progression.

          ## Covered lessons

          | Date | Domain | Topic | Lesson |
          |---|---|---|---|
          | 2026-11-13 | Software Engineering | Secure CI/CD Architecture and Progressive Delivery | Previously reported as covered; file not located during repository inspection |
          | 2026-11-22 | DBMS | MVCC and Snapshot Isolation: How Databases Let Readers and Writers Coexist | [Lesson](dbms/mvcc-and-snapshot-isolation.md) |
          | 2026-11-23 | ML/AI | Probability Calibration: Making ML Confidence Trustworthy | [Lesson](ml-ai/probability-calibration.md) |
          | 2026-11-24 | DSA | Rerooting DP on Trees: Compute Answers for Every Root in Linear Time | [Lesson](dsa/rerooting-dp-on-trees.md) |

          ## Weekly rotation
          - Monday — ML/AI
          - Tuesday — DSA
          - Wednesday — Distributed Systems
          - Thursday — Operating Systems & Computer Networks
          - Friday — Software Engineering
          - Saturday — LLD/HLD
          - Sunday — DBMS

          ## Publishing protocol
          - Use `docs/learning/<domain-slug>/<topic-slug>.md`; filenames are lowercase kebab-case and contain no dates.
          - Domain folders: `ml-ai`, `dsa`, `distributed-systems`, `os-networking`, `software-engineering`, `system-design`, `dbms`.
          - Include date, domain, level, and prerequisites in lesson metadata/body.
          - Check this tracker and repository for duplicate topics before drafting.
          - Lessons should include explanations, worked examples, trade-offs, pitfalls, interview questions, exercises, and authoritative references.
          - Update this tracker, homepage, and MkDocs navigation after publishing.
          - Preserve existing lesson content when reorganizing. No Obsidian or knowledge-graph content.
          """), encoding="utf-8")

          nav = """nav:
            - Home: index.md
            - Learning:
                - DSA:
                    - Graph Algorithms: learning/dsa/graph-algorithms.md
                    - Rerooting DP on Trees: learning/dsa/rerooting-dp-on-trees.md
                    - Interview Practice Log: learning/dsa/practice-log.md
                - DBMS:
                    - Multi-Level Indexing: learning/dbms/multi-level-indexing.md
                    - B+ Trees vs LSM Trees: learning/dbms/lsm-trees-vs-b-trees.md
                    - MVCC Internals: learning/dbms/mvcc-internals.md
                    - MVCC and Snapshot Isolation: learning/dbms/mvcc-and-snapshot-isolation.md
                    - PostgreSQL Internals: learning/dbms/postgresql-internals.md
                - Distributed Systems:
                    - Consistent Hashing: learning/distributed-systems/consistent-hashing.md
                    - Distributed Rate Limiting: learning/distributed-systems/distributed-rate-limiting.md
                    - Data Consistency Patterns: learning/distributed-systems/transactional-outbox-and-dual-write.md
                    - Message Broker Hardware Sympathy: learning/distributed-systems/message-broker-hardware-sympathy.md
                - OS & Networking:
                    - Hardware Mechanical Sympathy: learning/os-networking/hardware-mechanical-sympathy.md
                    - Lock-Free Concurrency: learning/os-networking/lock-free-concurrency.md
                - System Design:
                    - System Design Concepts: learning/system-design/system-design-fundamentals.md
                    - Requirements Engineering: learning/system-design/requirements-engineering.md
                - ML & AI:
                    - Probability Calibration: learning/ml-ai/probability-calibration.md
                - Topic Tracker: learning/topic-tracker.md
          """
          mk = Path("mkdocs.yml")
          config = mk.read_text(encoding="utf-8") if mk.exists() else "site_name: Resources\ntheme:\n  name: material\n"
          nav_re = re.compile(r"(?ms)^nav:\n.*?(?=^[A-Za-z0-9_-]+:|\Z)")
          config = nav_re.sub(nav.rstrip()+"\n", config) if nav_re.search(config) else config.rstrip()+"\n\n"+nav
          mk.write_text(config, encoding="utf-8")

          # Basic local-link validation (external URLs and anchors excluded).
          link_re = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          bad = []
          for md in Path("docs").rglob("*.md"):
            for raw in link_re.findall(md.read_text(encoding="utf-8")):
              target = raw.strip().split()[0].strip("<>").split("#",1)[0]
              if not target or target.startswith(("http://", "https://", "mailto:")): continue
              if not (md.parent / target).exists(): bad.append(f"{md}: {raw}")
          if bad:
            print("WARNING: These local links may need manual correction:\n" + "\n".join(bad))
          else:
            print("Local Markdown links validated.")
          print("Restructure finished.")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "${{ inputs.commit_message }}"
          git push
