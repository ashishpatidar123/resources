name: Sync LeetCode Solutions

on:
  workflow_dispatch:

  repository_dispatch:
    types: [leetcode_sync]

  schedule:
    # Daily at 02:00 UTC (07:30 IST)
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Resources
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Clone LeetCode solutions repository
        run: git clone --depth 1 https://github.com/ashishpatidar123/Coding-Questions-Solutions.git leetcode-source

      - name: Generate website pages
        run: python scripts/sync_leetcode.py

      - name: Update MkDocs navigation
        run: python scripts/update_nav.py

      - name: Commit generated pages (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/learning/dsa/leetcode mkdocs.yml scripts/update_nav.py

          if git diff --cached --quiet; then
            echo "No generated content changes."
          else
            git commit -m "chore: sync LeetCode solutions"
            git push origin main
          fi

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Deploy website
        run: mkdocs gh-deploy --force
